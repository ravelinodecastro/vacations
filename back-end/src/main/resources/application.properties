spring.application.name=vacations

# Datasource
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/vacations}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update

# JWT Resource Server
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI:http://localhost:8080/realms/lbc/protocol/openid-connect/certs}
